name: Release

# Every push to main is a candidate release: semantic-release reads the commit
# subjects since the last tag. A Renovate bump of one of the four dependencies
# arrives as fix(deps): and ships as a patch, which is how a new vite reaches
# every app - RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: Lautstark/.github/.github/workflows/release.yml@main
    with:
      gate: npm run typecheck && npm test
    secrets: inherit
